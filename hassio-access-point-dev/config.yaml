---
name: Hass.io Access Point by zsqsd
version: 0.5.4.5
slug: hassio-access-point-zqsd
description: Create a WiFi access point to directly connect devices to Home Assistant
arch: [armhf, armv7, aarch64, amd64, i386]
url: https://github.com/zqsd1/Hassio-Access-Point
startup: system
boot: auto
host_network: true
apparmor: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
init: false
options:
  dry_run: false
  log_level: info
  ssid:
  wpa_passphrase:
  channel: 6
  address: 192.168.99.1
  subnet_prefix: 24
  interface: wlan0
  hide_ssid: false
  dhcp: true
  dhcp_start_addr: 192.168.99.10
  dhcp_end_addr: 192.168.99.20
  allow_mac_addresses: []
  deny_mac_addresses: []
  hostapd_config_override: []
  client_internet_access: false
  client_dns_override: []
  dnsmasq_config_override: []
  monitored_interface: null
schema:
  dry_run: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssid: match(^.{2,32}$)
  wpa_passphrase: password
  channel: int(1,13)
  address: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  subnet_prefix: int(8,31)
  interface: str
  hide_ssid: bool
  dhcp: bool
  dhcp_start_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  dhcp_end_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  allow_mac_addresses:
    - match(^([0-9a-fA-F]{2}:){4}[0-9a-fA-F]{2})?
  deny_mac_addresses:
    - match(^([0-9a-fA-F]{2}:){4}[0-9a-fA-F]{2})?
  ht_capab: match(^(\[[A-Z0-9][A-Z0-9_+-]*\])+$)?
  hostapd_config_override:
    - str?
  client_internet_access: bool
  client_dns_override:
    - match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  dnsmasq_config_override:
    - str?
  monitored_interface: "device(subsystem=net)?"  
