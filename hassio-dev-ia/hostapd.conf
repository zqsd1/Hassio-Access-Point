# Base hostapd config — ssid, passphrase, channel, interface are set at runtime by run.sh
driver=nl80211
hw_mode=g
ieee80211n=1
wmm_enabled=1

# WPA2-PSK (Matter over Wi-Fi)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Clients may reach each other (required for Matter / mDNS on the AP segment)
ap_isolate=0

# Regulatory domain (override via hostapd_config_override if needed)
ieee80211d=1
country_code=FR

# Logging
logger_stdout=-1
logger_stdout_level=2

# Placeholders replaced by run.sh
interface=wlan0
ssid=changeme
wpa_passphrase=changeme
channel=6
ignore_broadcast_ssid=0
macaddr_acl=0
