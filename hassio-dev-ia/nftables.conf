#!/usr/sbin/nft -f
# Isolated Wi-Fi AP: clients on wlan0 may talk to each other; no LAN/WAN path.
# Policy accept on hooks — only explicit drops (safe on host-network HA OS).

define AP_IFACE = wlan0
define AP_V4_NET = 192.168.99.0/24
define AP_V6_NET = fd99:99::/64

table inet hassio_ap {
	chain forward {
		type filter hook forward priority filter; policy accept;

		# Client <-> client on the AP interface
		iifname $AP_IFACE oifname $AP_IFACE accept

		# Block routed traffic between AP and everything else
		iifname $AP_IFACE oifname != $AP_IFACE drop
		oifname $AP_IFACE iifname != $AP_IFACE drop
	}

	chain input {
		type filter hook input priority filter + 10; policy accept;


		iifname $AP_IFACE oifname $AP_IFACE accept

		iifname $AP_IFACE oifname != $AP_IFACE drop
		oifname $AP_IFACE iifname != $AP_IFACE drop
		# Wi-Fi clients may only reach addresses on the AP segment (not HA LAN/WAN IPs)
		# iifname $AP_IFACE ip daddr $AP_V4_NET accept
		# iifname $AP_IFACE ip6 daddr $AP_V6_NET accept
		# iifname $AP_IFACE ip6 daddr fe80::/10 accept
		# iifname $AP_IFACE ip6 daddr ff02::/16 accept

		# Matter / commissioning: ICMP, mDNS, DNS, DHCP
		# iifname $AP_IFACE ip protocol icmp accept
		# iifname $AP_IFACE ip6 nexthdr ipv6-icmp accept
		# iifname $AP_IFACE udp dport { 53, 67, 68, 5353, 546, 547 } accept
		# iifname $AP_IFACE tcp dport 53 accept

		# iifname $AP_IFACE drop
	}
}
